<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="AI Linux Assistant">
  <!-- App icon: 11-bar waveform taper on a gradient blue glass card.
       Replaces the placeholder; designed to match the bar-based identity
       used throughout the app (bar_model.py, WaveBars, floating pill). -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c71d8"/>
      <stop offset="0.5" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Glass card -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#card)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>

  <!-- 11 bars: taper 0.30–1.00–0.30, opacity 0.75–1.00–0.75 -->
  <g fill="#ffffff">
    <rect x="18"   y="56"  width="6" height="16" rx="3" opacity="0.75"/>
    <rect x="26.4" y="52"  width="6" height="24" rx="3" opacity="0.80"/>
    <rect x="34.8" y="47"  width="6" height="34" rx="3" opacity="0.85"/>
    <rect x="43.2" y="41"  width="6" height="46" rx="3" opacity="0.90"/>
    <rect x="51.6" y="35"  width="6" height="58" rx="3" opacity="0.95"/>
    <rect x="60"   y="30"  width="8" height="68" rx="4" opacity="1.0"/>
    <rect x="70.4" y="35"  width="6" height="58" rx="3" opacity="0.95"/>
    <rect x="78.8" y="41"  width="6" height="46" rx="3" opacity="0.90"/>
    <rect x="87.2" y="47"  width="6" height="34" rx="3" opacity="0.85"/>
    <rect x="95.6" y="52"  width="6" height="24" rx="3" opacity="0.80"/>
    <rect x="104"  y="56"  width="6" height="16" rx="3" opacity="0.75"/>
  </g>
</svg>
