[project]
name = "ai-linux"
dynamic = ["version"]
description = "Phoenix, a local voice assistant for the GNOME desktop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"  # ollama.py unpacks Ollama's .tar.zst with tarfile mode "r|zst"

[project.optional-dependencies]
# The app runs on the system's python3-gi and python3-cairo from apt; these are the same packages from PyPI.
app = [
    "PyGObject",
    "pycairo",
]
# A copy of requirements-engine.txt, which stays the source of truth; tests/test_pyproject.py keeps them equal.
engine = [
    "numpy==2.4.6",
    "onnxruntime==1.26.0",
    "openvino==2026.4.1",
    "tokenizers==0.22.2",
    "numba==0.65.1",
    "llvmlite==0.47.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "threadpoolctl==3.6.0",
    "soundfile==0.14.0",
    "pywebrtc-audio==0.2.0",
    "supertonic==1.3.1",
    "huggingface_hub==1.21.0",
]

[project.urls]
Homepage = "https://github.com/itsDigvijaysing/AI_Linux_Assistant"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_linux"]

# Ruff configuration
[tool.ruff]
# Same as Black
line-length = 120
indent-width = 4

# Enable all rules, including those that replace Black and isort
lint.extend-select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "ANN", # Annotation rules
    "PYI", # Type stub rules
]

target-version = "py314"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint.isort]
order-by-type = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
